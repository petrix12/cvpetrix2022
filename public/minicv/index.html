<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Bazó | Backend Engineer</title>
  
  <!-- Icono de consola en pestaña -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50%' y='52%' dominant-baseline='central' text-anchor='middle' fill='%2338bdf8' font-family='monospace' font-weight='bold' font-size='50'>&gt;_</text></svg>">

  <!-- Previsualización enriquecida para WhatsApp (Open Graph) -->
  <meta property="og:title" content="Pedro Bazó | Senior Backend Developer">
  <meta property="og:description" content="PHP • Laravel • DDD & Arquitectura Hexagonal • AWS • Vue.js. Revisa mi resumen técnico en 30 segundos.">
  <meta property="og:type" content="website">
  <!-- Si subes una imagen previa a tu servidor, coloca la URL completa aquí -->
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/php/php-original.svg">

  <!-- Petite Vue CDN -->
  <script src="https://unpkg.com/petite-vue" defer init></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* Contenedor optimizado para pantalla móvil (9:16 / Pantalla completa) */
    .cv-card {
      width: 100%;
      max-width: 390px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }

    .avatar-icon {
      width: 60px;
      height: 60px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .name { font-size: 1.4rem; font-weight: 700; color: #ffffff; }
    .role { font-size: 0.9rem; color: #38bdf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .grid-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-family: monospace;
    }
    .tag.highlight { border-color: #38bdf8; color: #38bdf8; }

    .highlights-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .highlights-list li {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .highlights-list li::before {
      content: "⚡";
      font-size: 0.8rem;
    }

    .cta-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 4px;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <!-- Componente Petite Vue -->
  <div v-scope="{
    name: 'Pedro Bazó',
    role: 'Backend Engineer',
    years: '4+ años exp.',
    skills: ['PHP 8+', 'Laravel', 'DDD / Hexagonal', 'Vue.js', 'AWS', 'Docker', 'TDD / PHPUnit', 'PostgreSQL'],
    highlights: [
      'Diseño de arquitecturas desacopladas y escalables (DDD/Hexagonal).',
      'Desarrollo de APIs REST robustas y optimización de consultas en BD.',
      'Implementación de pruebas unitarias y automatización CI/CD.'
    ]
  }" class="cv-card">
    
    <div class="header">
      <div class="avatar-icon">🚀</div>
      <h1 class="name">{{ name }}</h1>
      <p class="role">{{ role }} • {{ years }}</p>
    </div>

    <div>
      <div class="section-title">Core Tech Stack</div>
      <div class="grid-tags">
        <span v-for="(skill, index) in skills" :key="skill" :class="['tag', index < 3 ? 'highlight' : '']">
          {{ skill }}
        </span>
      </div>
    </div>

    <div>
      <div class="section-title">Especialidades & Impacto</div>
      <ul class="highlights-list">
        <li v-for="item in highlights" :key="item">{{ item }}</li>
      </ul>
    </div>

    <a href="mailto:tu-email@ejemplo.com" class="cta-btn">Contactar / Ver CV Completo</a>
  </div>

</body>
</html>
