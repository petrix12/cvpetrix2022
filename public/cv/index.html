<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedro Bazó | Backend Engineer</title>

    <!-- Favicon / Consola -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50%' y='52%' dominant-baseline='central' text-anchor='middle' fill='%232563eb' font-family='monospace' font-weight='bold' font-size='50'>&gt;_</text></svg>" />

    <!-- Previsualización enriquecida (Open Graph) -->
    <meta property="og:title" content="Pedro Bazó | Full-Stack Developer" />
    <meta property="og:description" content="PHP • Laravel • AWS • Vue.js • Docker" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://petrix12.github.io/cvpetrix2022/cv/" />
    <meta property="og:image" content="https://petrix12.github.io/cvpetrix2022/cv/assets/img/og-preview.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="682" />
    <meta property="og:image:height" content="682" />

    <!-- Fuentes e Iconos de FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos Unificados de la Aplicación -->
    <link rel="stylesheet" href="./assets/css/cv.css" />

    <!-- CDN de Petite-Vue (ocupa solo ~6 KB) -->
    <script src="https://unpkg.com/petite-vue"></script>
    <!-- Datos del CV en formato JSON -->
    <script src="./assets/js/cv-data.js"></script>    
</head>

<body class="mini-cv-page">
    <main         
        id="app" 
        v-scope="window.cvData"
        class="cv-card"
    >
        <header class="card-header">
            <div class="profile-box">
                <a :href="url_img_perfil" target="_blank" rel="noopener noreferrer">
                    <img v-if="url_img_perfil" :src="url_img_perfil" :alt="nombre" class="profile-img" />
                    <div v-else class="avatar-icon">🚀</div>
                </a>                
            </div>
            <a href="./cv.html" target="_blank" rel="noopener noreferrer">
                <h1 class="card-title">{{ nombre }}</h1>
            </a>
            <p class="card-subtitle">{{ titulo_profesional }}</p>
        </header>

        <section>
            <h3 class="card-section-title">Tech Skills</h3>
            <div class="skills-tag-container">
                <span 
                    v-for="(skill, index) in tech_skills" 
                    :key="skill" 
                    :class="['skill-tag', index < 4 ? 'highlight' : '']"
                >
                    {{ skill }}
                </span>
            </div>
        </section>

        <section>
        <h3 class="card-section-title">Especialidades & Impacto</h3>
            <div class="impact-grid">
                <div 
                    v-for="item in especialidades_impacto" 
                    :key="item.nombre" 
                    class="impact-card"
                >
                    <div class="impact-icon">
                        <i :class="item.icono"></i>
                    </div>
                    <div class="impact-body">
                        <span class="impact-label">{{ item.nombre }}</span>
                        <p class="impact-value" v-html="item.descripcion"></p>
                    </div>
                </div>
            </div>
        </section>

        <footer class="card-footer">
            <a :href="'mailto:' + email" class="btn-action btn-full">
                <i class="fa-solid fa-paper-plane"></i> Contactar / Enviar Email
            </a>

            <div class="social-links">
                <a 
                    v-if="movil" 
                    :href="'https://wa.me/' + movil + '?text=Hola%20Pedro,%20vi%20tu%20CV%20y%20me%20gustar%C3%ADa%20contactarte'"
                    target="_blank" rel="noopener" class="social-btn" title="WhatsApp"
                >
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a v-if="url_linkedin" :href="url_linkedin" target="_blank" rel="noopener" class="social-btn" title="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
                <a v-if="url_github" :href="url_github" target="_blank" rel="noopener" class="social-btn" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a v-if="url_site" :href="url_site" target="_blank" rel="noopener" class="social-btn" title="Web Portfolio">
                    <i class="fa-solid fa-globe"></i>
                </a>
                <a href="./cv.html" target="_blank" rel="noopener" class="social-btn" title="Ver CV Completo">
                    <i class="fa-solid fa-file-lines"></i>
                </a>
            </div>
        </footer>
    </main>

    <script>
        // Objeto reactivo de la aplicación
        const appState = PetiteVue.reactive({
            // Inyección limpia de datos puros desde cv-data.js
            ...window.cvData
        });

        // Montar la aplicación
        PetiteVue.createApp(appState).mount('#app');        
    </script>
</body>

</html>
